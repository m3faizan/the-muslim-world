kind = "web"
previewPath = "/"
title = "The Muslim World"
version = "1.0.0"
id = "artifacts/muslim-world"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18202

[services.development]
run = "pnpm --filter @workspace/muslim-world run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/muslim-world", "run", "build" ]
publicDir = "artifacts/muslim-world/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18202"
BASE_PATH = "/"
